name: Build, Push & Deploy

on:
  push:
    branches:
      - development

env:
  DEPLOY_PATH: /home/ec2-user/medvirtual-backend
  PM2_APP_NAME: medvirtual-backend

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Strip devDependencies
        run: npm prune --omit=dev

      - name: Package release
        run: tar -czf release.tar.gz dist node_modules package.json

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SERVER_SSH_KEY }}

      - name: Trust server host key
        run: ssh-keyscan -H "${{ secrets.STAGING_SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload release
        run: |
          scp release.tar.gz \
            "${{ secrets.SERVER_USER }}@${{ secrets.STAGING_SERVER_HOST }}:/home/ec2-user/release.tar.gz"

      # dist/, node_modules/ and package.json are replaced on every deploy;
      # the persisted .env in $DEPLOY_PATH is never touched.
      - name: Extract & restart on server
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.STAGING_SERVER_HOST }}" '
            set -e
            mkdir -p "${{ env.DEPLOY_PATH }}"
            cd "${{ env.DEPLOY_PATH }}"
            rm -rf dist node_modules package.json
            tar -xzf /home/ec2-user/release.tar.gz -C "${{ env.DEPLOY_PATH }}"
            rm -f /home/ec2-user/release.tar.gz
            if pm2 describe "${{ env.PM2_APP_NAME }}" > /dev/null 2>&1; then
              pm2 reload "${{ env.PM2_APP_NAME }}" --update-env
            else
              pm2 start dist/main.js --name "${{ env.PM2_APP_NAME }}" --cwd "${{ env.DEPLOY_PATH }}"
            fi
            pm2 save
          '

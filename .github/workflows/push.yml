name: Deploy at AWS Lambda (Dev environment) 

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
      LAMBDA_WORKER_NAME: ${{ secrets.LAMBDA_WORKER_NAME_DEV }}
      S3_LAMBDA_BUCKET: ${{ secrets.S3_LAMBDA_BUCKET }}
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: 🧾 Code Checkout
        uses: actions/checkout@v4

      - name: 🧹 Clean Prisma artifacts
        run: |
          rm -rf node_modules/.prisma
          rm -rf node_modules/@prisma/client

      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🔥 Remove Prisma cache (opcional)
        run: rm -rf node_modules/.cache

      - name: 📦 remove binaries from macOs
        run: rm -rf node_modules/.prisma

      - name: 🧱 Prisma generate
        run: npx prisma generate

      - name: 🗄️ Run Prisma migrations (Stage)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGE }}
        run: npx prisma migrate deploy

      - name: 🔨 Build with webpack
        #run: npm run build:esbuild
        run: npx webpack --config webpack.config.js

          

      - name: 📁 Build lambda-package
        run: |
          mkdir lambda-package
          cp -r dist/* lambda-package/
          cp -r prisma/schema.prisma lambda-package/prisma/
          cp package.prod.json lambda-package/package.json
          if [ -f .env ]; then cp .env lambda-package/; else echo "⚠️  Arquivo .env não encontrado, ignorando..."; fi
      
      - name: 🧹 Remove arquivos .map
        run: find lambda-package -name "*.map" -type f -delete

      - name: 📦 Copy prisma Cliente only
        run: |
          mkdir -p lambda-package/node_modules/.prisma
          cp -r node_modules/.prisma/client lambda-package/node_modules/.prisma/

      - name: 📊 Debug lambda-package size
        run: |
          du -sh lambda-package
          du -sh lambda-package/node_modules || true
          du -sh lambda-package/node_modules/.prisma || true
          du -sh lambda-package/prisma || true


      - name: 📦 Build ZIP files
        working-directory: lambda-package
        run: zip -r ../lambda.zip . > /dev/null

      - name: 🚀 Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: 📤 Upload ZIP to S3
        run: |
          aws s3 cp lambda.zip s3://$S3_LAMBDA_BUCKET/lambda.zip
          
      - name: 🚀 Deploy at AWS Lambda (via S3)
        run: |
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION_NAME \
            --s3-bucket $S3_LAMBDA_BUCKET \
            --s3-key lambda.zip \
            --no-cli-pager \
            --output text
      
      - name: 🚀 Deploy Worker at AWS Lambda (via S3)
        run: |
          aws lambda update-function-code \
            --function-name $LAMBDA_WORKER_NAME \
            --s3-bucket $S3_LAMBDA_BUCKET \
            --s3-key lambda.zip \
            --no-cli-pager \
            --output text


      - name: 🧹 Clean temp files
        run: rm -rf lambda-package lambda.zip

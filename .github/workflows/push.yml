name: Deploy at AWS Lambda (Dev environment) 

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
      S3_LAMBDA_BUCKET: ${{ secrets.S3_LAMBDA_BUCKET }}
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: 🧾 Code Checkout
        uses: actions/checkout@v4

      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🔥 Remove Prisma cache (opcional)
        run: rm -rf node_modules/.cache

      - name: 📦 remove binaries from macOs
        run: rm -rf node_modules/.prisma

      - name: Update binaryTargets for production (Linux)
        run: sed -i 's/binaryTargets = \["native"\]/binaryTargets = \["rhel-openssl-1.0.x"\]/' prisma/schema.prisma

      - name: 🧱 Prisma by docker
        run: docker run --rm -v $(pwd):/app -w /app node:18 npx prisma generate

      - name: 🔐 Fix Prisma file permissions
        run: |
          sudo chown -R $(whoami):$(whoami) node_modules/.prisma

      - name: 🔨 Build with webpack
        #run: npm run build:esbuild
        run: npx webpack --config webpack.config.js

      - name: 🧹 Keep only Linux Prisma binary
        run: |
          find node_modules/.prisma -type f \
            ! -name "*openssl*" \
            ! -name "*linux*" \
            ! -name "*.js" \
            ! -name "*.d.ts" \
            ! -name "*.json" \
            ! -name "*.prisma" \
            -delete

   

      - name: 📁 Build lambda-package
        run: |
          mkdir lambda-package
          cp -r dist/* lambda-package/
          cp -r prisma/schema.prisma lambda-package/prisma/
          cp package.prod.json lambda-package/package.json
          if [ -f .env ]; then cp .env lambda-package/; else echo "⚠️  Arquivo .env não encontrado, ignorando..."; fi

      - name: 📦 Install just production dependencies
        working-directory: lambda-package
        run: npm install --omit=dev
      
      - name: 🧹 Remove arquivos .map
        run: find lambda-package -name "*.map" -type f -delete

      - name: 📦 Copy prisma binaries
        run: |
          mkdir -p lambda-package/node_modules/.prisma
          cp -r node_modules/.prisma/client lambda-package/node_modules/.prisma/

      - name: 📦 Build ZIP files
        working-directory: lambda-package
        run: zip -r ../lambda.zip . > /dev/null

      - name: 🚀 Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: 📤 Upload ZIP to S3
        run: |
          aws s3 cp lambda.zip s3://$S3_LAMBDA_BUCKET/lambda.zip
          
      - name: 🚀 Deploy at AWS Lambda (via S3)
        run: |
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION_NAME \
            --s3-bucket $S3_LAMBDA_BUCKET \
            --s3-key lambda.zip \
            --no-cli-pager \
            --output text


      - name: 🧹 Clean temp files
        run: rm -rf lambda-package lambda.zip
